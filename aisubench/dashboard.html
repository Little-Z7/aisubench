<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISUBench 监控面板</title>
<style>
:root {
  --bg: #0a0e1a;
  --fg: #e8edf6; --dim: #93a0b4; --dim2: #6b7890;
  --accent: #6ea8ff; --accent2: #a78bfa;
  --ok: #34d399; --warn: #fbbf24; --bad: #f87171;
  --glass: rgba(255, 255, 255, .055);
  --glass-border: rgba(255, 255, 255, .11);
  --glass-shadow: 0 10px 34px rgba(2, 6, 18, .45);
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--fg); min-height: 100vh;
  font: 14px/1.55 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
}
/* 固定不动的低饱和彩色光斑：给毛玻璃提供可模糊的层次 */
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(52vw 52vw at 12% -6%, rgba(56, 89, 199, .34), transparent 62%),
    radial-gradient(46vw 46vw at 88% 18%, rgba(124, 78, 189, .28), transparent 60%),
    radial-gradient(58vw 58vw at 55% 105%, rgba(23, 116, 128, .30), transparent 64%),
    var(--bg);
}
.wrap { max-width: 900px; margin: 0 auto; padding: 22px 18px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-size: 21px; margin: 0; font-weight: 650; letter-spacing: .01em;
  background: linear-gradient(92deg, #eaf0ff, #b9c8ff 60%, #a78bfa);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.sub { color: var(--dim); font-size: 12px; margin-top: 3px; }
button {
  background: rgba(255, 255, 255, .07); color: var(--fg);
  border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 7px 16px; cursor: pointer; font-size: 13px;
  backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
  transition: transform .15s, border-color .15s, background .15s;
}
button:hover:not(:disabled) {
  background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .22);
  transform: translateY(-1px);
}
button:disabled { opacity: .45; cursor: not-allowed; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
#bench-link, #debug-link { font-size: 13px; align-self: center; }

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, .06);
}

/* 全局元信息卡：统计行 + 样本口径说明 */
#meta { margin: 14px 0 16px; padding: 14px 18px; font-size: 13px; }
#meta.stale { opacity: .6; }
.stats { display: flex; gap: 26px; flex-wrap: wrap; margin-bottom: 8px; }
.stat .v {
  font-size: 21px; font-weight: 650; letter-spacing: .01em;
  font-variant-numeric: tabular-nums;
}
.stat .v .u { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 2px; }
.stat .k { color: var(--dim); font-size: 11.5px; margin-top: 1px; }
.meta-line { color: var(--dim); }
.warn-text { color: var(--warn); }

#subs { display: flex; flex-direction: column; gap: 16px; }

/* 订阅卡片 */
.sub-card { padding: 16px 18px; transition: transform .18s, border-color .18s; }
.sub-card:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .2); }
.sub-card.stale { opacity: .6; }
.sub-head { display: flex; align-items: center; gap: 13px; }
.brand {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 700; color: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 4px 14px rgba(0, 0, 0, .3);
}
.sub-title-block { flex: 1; min-width: 0; }
.sub-title { font-weight: 600; font-size: 15.5px; }
.sub-title .acct { color: var(--dim); font-weight: 400; font-size: 13px; }
.sub-src { color: var(--dim); font-size: 12px; margin-top: 1px; }
.sub-updated { color: var(--dim); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }

/* 任务标定按钮 + 标定值徽标 */
.cal-btn { flex: none; padding: 5px 12px; font-size: 12px; border-radius: 9px; }
.cal-btn .spin {
  display: inline-block; width: 10px; height: 10px; margin-right: 5px;
  vertical-align: -1px; border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, .25); border-top-color: #fff;
  animation: cal-rot .8s linear infinite;
}
@keyframes cal-rot { to { transform: rotate(360deg); } }
.calib-badge {
  display: inline-block; padding: 0 8px; border-radius: 9px; font-size: 11px;
  color: #fff; border: 1px solid transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 10px rgba(110, 168, 255, .4);
}

/* 池行：主行（池名/进度条/%/ETA/铃铛）+ token 次级行 */
.pool-rows { margin-top: 14px; display: flex; flex-direction: column; gap: 13px; }
.pool-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.p-name { width: 52px; flex: none; color: var(--fg); font-variant-numeric: tabular-nums; }
.p-bar {
  flex: 1; height: 7px; border-radius: 4px; overflow: hidden;
  background: rgba(255, 255, 255, .08);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3);
}
.p-fill {
  height: 100%; border-radius: 4px; transition: width .4s;
  background: linear-gradient(90deg, #34d399, #6ee7b7);
  box-shadow: 0 0 8px rgba(52, 211, 153, .55);
}
.p-fill.mid {
  background: linear-gradient(90deg, #fbbf24, #fde68a);
  box-shadow: 0 0 8px rgba(251, 191, 36, .55);
}
.p-fill.high {
  background: linear-gradient(90deg, #f87171, #fca5a5);
  box-shadow: 0 0 8px rgba(248, 113, 113, .55);
}
.p-fill.none { background: rgba(255, 255, 255, .14); box-shadow: none; }
.p-pct {
  width: 46px; flex: none; text-align: right;
  font-variant-numeric: tabular-nums; font-weight: 600;
}
.p-eta {
  width: 66px; flex: none; text-align: right; color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.p-tokens {
  margin: 5px 0 0 62px; display: flex; gap: 8px 18px; flex-wrap: wrap;
  font-size: 12px; color: var(--dim);
}
.p-tokens .t { font-variant-numeric: tabular-nums; }
.p-tokens .t b {
  color: var(--fg); font-weight: 600; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.p-tokens .t .rng { color: var(--dim2); font-size: 11.5px; }
.p-tokens .t.unavail { color: var(--dim2); }

.bell {
  flex: none; width: 27px; height: 27px; padding: 0; border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--dim);
}
.bell svg { width: 14px; height: 14px; }
.bell.on {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 0 10px rgba(110, 168, 255, .5);
}
.bell.on svg { fill: rgba(255, 255, 255, .9); }
.recovered {
  flex: none; font-size: 11px; color: var(--ok);
  border: 1px solid rgba(52, 211, 153, .5); border-radius: 10px; padding: 0 8px;
  background: rgba(52, 211, 153, .1);
}

/* 订阅汇总行：监测跨度内累计 tokens */
.sub-total {
  margin-top: 14px; padding-top: 11px;
  border-top: 1px solid rgba(255, 255, 255, .08);
  display: flex; align-items: baseline; gap: 8px 16px; flex-wrap: wrap;
  font-size: 12px; color: var(--dim);
}
.sub-total .total-v {
  font-size: 17px; font-weight: 650; color: var(--fg);
  font-variant-numeric: tabular-nums;
}
.sub-total .total-v .u { font-size: 11.5px; font-weight: 500; color: var(--dim); }
.sub-total .brk { font-variant-numeric: tabular-nums; }
.sub-total .brk b { color: var(--fg); font-weight: 600; }

.analysis {
  margin-top: 12px; padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, .08);
  color: var(--warn); font-size: 12.5px;
}
.no-pools { margin-top: 12px; color: var(--dim); font-size: 12.5px; }

.empty {
  padding: 30px; text-align: center; color: var(--dim);
  border: 1px dashed rgba(255, 255, 255, .18); border-radius: 18px;
  background: var(--glass);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.empty code {
  color: var(--accent); background: rgba(255, 255, 255, .08);
  padding: 2px 6px; border-radius: 6px;
}
#toast {
  position: fixed; bottom: 18px; right: 18px; display: none; font-size: 13px;
  padding: 9px 16px; border-radius: 12px;
  background: rgba(30, 38, 56, .75); border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: var(--glass-shadow);
}

/* CodexBar 风格顶部 Tab 栏：概览 + 每订阅一个 Tab（纯前端切换，无路由） */
#tabs {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin: 0 0 16px; padding: 5px; border-radius: 14px;
  background: var(--glass); border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
}
.tab {
  flex: none; padding: 6px 16px; border-radius: 10px; font-size: 13px;
  background: transparent; border: 1px solid transparent; color: var(--dim);
}
.tab:hover:not(.on) { color: var(--fg); background: rgba(255, 255, 255, .06); transform: none; }
.tab.on {
  color: var(--fg); background: rgba(255, 255, 255, .11);
  border-color: var(--glass-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
}

/* 单订阅详细视图（CodexBar 菜单栏 popover 布局） */
.detail { padding: 18px 20px; }
.detail.stale { opacity: .6; }
.d-head { display: flex; align-items: center; gap: 13px; }
.d-title { font-size: 17px; font-weight: 650; }
.d-title .acct { color: var(--dim); font-weight: 400; font-size: 13px; }
.d-sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

/* 池块：池名+推断重置（上）/ 大号剩余% / 10 段分段条 / 速率副行 / token 明细行 */
.d-pool {
  margin-top: 16px; padding: 14px 16px; border-radius: 14px;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08);
}
.d-pool-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.d-pool-name {
  font-size: 12.5px; font-weight: 600; color: var(--dim);
  letter-spacing: .05em; text-transform: uppercase;
}
.d-reset { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; }
.d-pct {
  font-size: 30px; font-weight: 700; margin-top: 3px;
  font-variant-numeric: tabular-nums; letter-spacing: .01em;
}
.d-pct .u { font-size: 13px; font-weight: 500; color: var(--dim); margin-left: 7px; }
.d-pct.ok { color: var(--ok); }
.d-pct.mid { color: var(--warn); }
.d-pct.high { color: var(--bad); }
.d-pct.none { color: var(--dim2); font-size: 22px; font-weight: 600; }
.seg-bar { display: flex; gap: 4px; margin-top: 10px; }
.seg {
  flex: 1; height: 9px; border-radius: 5px;
  background: rgba(255, 255, 255, .07);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, .3);
  transition: background .3s;
}
.seg.on { background: linear-gradient(180deg, #6ee7b7, #34d399); box-shadow: 0 0 6px rgba(52, 211, 153, .5); }
.seg.on.mid { background: linear-gradient(180deg, #fde68a, #fbbf24); box-shadow: 0 0 6px rgba(251, 191, 36, .5); }
.seg.on.high { background: linear-gradient(180deg, #fca5a5, #f87171); box-shadow: 0 0 6px rgba(248, 113, 113, .5); }
.seg.on.none { background: rgba(255, 255, 255, .14); box-shadow: none; }
.d-pool-sub { margin-top: 9px; font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.d-pool-sub b { color: var(--fg); font-weight: 600; }
.d-pool-sub .rng { color: var(--dim2); font-size: 11.5px; }

/* 统计双列块：今日 / 近 30 天 各 token 用量 + 折算费用 */
.d-stats { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.d-stat {
  padding: 12px 14px; border-radius: 12px;
  background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .08);
}
.d-stat .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
.d-stat .v .u { font-size: 12px; font-weight: 500; color: var(--dim); margin-left: 2px; }
.d-stat .v.na { color: var(--dim2); font-size: 15px; font-weight: 500; }
.d-stat .k { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
.d-hint { margin-top: 8px; font-size: 12px; color: var(--warn); }
.d-hint.dim { color: var(--dim2); }

/* 30 天每日 tokens 柱状图（SVG，无外部库；最高柱标数值） */
.d-chart { margin-top: 16px; }
.d-chart-t { font-size: 12.5px; color: var(--dim); margin-bottom: 6px; }
.d-chart svg { width: 100%; height: auto; display: block; }
.d-chart .bar { fill: rgba(110, 168, 255, .42); }
.d-chart .bar.max { fill: var(--accent); }
.d-chart .axis { fill: var(--dim2); font-size: 9.5px; }
.d-chart .max-label { fill: var(--fg); font-size: 10.5px; font-weight: 600; }

.d-foot {
  margin-top: 15px; padding-top: 11px;
  border-top: 1px solid rgba(255, 255, 255, .08);
  font-size: 12.5px; color: var(--dim);
}
.d-foot b { color: var(--fg); font-weight: 600; }

@media (max-width: 640px) {
  .p-tokens { margin-left: 0; }
  .stats { gap: 18px; }
  .d-stats { grid-template-columns: 1fr; }
  .d-pct { font-size: 25px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AISUBench 持续监测</h1>
      <div class="sub" id="ledger"></div>
    </div>
    <a id="bench-link" href="/bench">任务评测</a>
    <a id="debug-link" href="/debug" hidden>调试模式</a>
    <button id="sample-btn" disabled>立即采样</button>
  </header>
  <section id="meta" class="glass">加载中…</section>
  <nav id="tabs"></nav>
  <main id="subs"></main>
</div>
<div id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const num = x => (x === null || x === undefined) ? null
  : Math.round(x).toLocaleString("en-US");
const fixed = (x, d) => (x === null || x === undefined) ? null : Number(x).toFixed(d);
const trimNum = x => Number(Number(x).toFixed(1));

// token 大数字缩写：950 → "950"，12,340 → "12.3k"，1,800,000 → "1.8M"
const fmtTok = x => {
  if (x === null || x === undefined) return null;
  const n = Number(x);
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k";
  return String(Math.round(n));
};
const tok = x => fmtTok(x) === null ? null : fmtTok(x);

// TPS 展示：数据层已保留两位小数，这里去掉尾随 0（4.50 → 4.5、0.28 → 0.28）
const fmtTps = x => Number(x).toFixed(2).replace(/\.?0+$/, "");

// 已弹过通知的恢复事件（key@lastSampleTs），同一恢复不重复弹
const notified = new Set();

// 当前选中 Tab："overview" 或订阅名（纯前端切换，无路由）；lastData 供切 Tab 重绘
let activeTab = "overview";
let lastData = null;

const BELL_SVG = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor"
  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M8 1.5a4.5 4.5 0 0 0-4.5 4.5v3L2 11.5h12L12.5 9V6A4.5 4.5 0 0 0 8 1.5z"/>
  <path d="M6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>`;

function brandColor(label) {
  let hash = 0;
  for (const ch of String(label)) hash = (hash * 31 + ch.codePointAt(0)) % 360;
  return `linear-gradient(135deg, hsl(${hash}, 52%, 46%), hsl(${(hash + 40) % 360}, 55%, 34%))`;
}

function etaText(p) {
  if (!p.has_samples) return "—";
  const e = p.eta_hours;
  if (e === null || e === undefined) return "不可用";
  const totalMin = Math.round(e * 60);
  const d = Math.floor(totalMin / 1440);
  const h = Math.floor((totalMin % 1440) / 60);
  const m = totalMin % 60;
  if (d > 0) return `${d}d ${h}h`;
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

// 秒级时长缩写：详图「约 Xd 后重置」等用（300s → 5m，7h → 7h，40h → 1d 16h）
function durText(sec) {
  const m = Math.round(sec / 60);
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  if (h < 48) return m % 60 ? `${h}h ${m % 60}m` : `${h}h`;
  const d = Math.floor(h / 24);
  return h % 24 ? `${d}d ${h % 24}h` : `${d}d`;
}

// 池的 token 次级行：已用≈ · 100%当量Q（区间）· 速率 · TPS
function poolTokenRow(p) {
  if (!p.has_samples)
    return `<div class="p-tokens"><span class="t unavail">账本中暂无该池样本</span></div>`;
  const used = tok(p.used_tokens);
  const parts = [];
  parts.push(used === null
    ? `<span class="t unavail">已用 ≈ —</span>`
    : `<span class="t">已用 ≈ <b>${used}</b> tok</span>`);
  if (!p.available) {
    parts.push(`<span class="t unavail">100% 当量 Q：数据不足(Δ 未超粒度)</span>`);
  } else {
    const q = tok(p.quota_tokens);
    const lo = tok(p.q_low), hi = tok(p.q_high);
    const rng = (lo !== null && hi !== null) ? ` <span class="rng">(${lo}–${hi})</span>`
      : lo !== null ? ` <span class="rng">(≥${lo})</span>` : "";
    parts.push(`<span class="t">Q ≈ <b>${q === null ? "—" : q}</b>${rng}</span>`);
  }
  // 任务标定产出的 Q：与监测估算并列展示（徽标 + 悬停显示标定时间），不互相覆盖
  if (p.calibrated_q !== null && p.calibrated_q !== undefined) {
    const when = p.calibrated_at
      ? new Date(p.calibrated_at * 1000).toLocaleString("zh-CN", {hour12: false})
      : "未知";
    parts.push(`<span class="t"><span class="calib-badge" `
      + `title="任务标定时间：${esc(when)}">标定值 Q ≈ ${tok(p.calibrated_q)}</span></span>`);
  }
  parts.push(p.rate_tph === null || p.rate_tph === undefined
    ? `<span class="t unavail">速率：不可用</span>`
    : `<span class="t"><b>${tok(p.rate_tph)}</b> tok/h</span>`);
  parts.push(p.tps === null || p.tps === undefined
    ? `<span class="t unavail">TPS：不可用</span>`
    : `<span class="t">TPS <b>${fmtTps(p.tps)}</b></span>`);
  return `<div class="p-tokens">${parts.join("")}</div>`;
}

function poolRow(sub, p, alerts) {
  const pct = p.current_pct;
  const width = Math.max(0, Math.min(100, pct === null ? 0 : pct));
  const cls = pct === null ? "none" : pct >= 90 ? "high" : pct >= 70 ? "mid" : "";
  const key = `${sub.name}.${p.name}`;
  const alertOn = !!alerts[key];
  const recovered = p.prev_pct !== null && p.prev_pct !== undefined
    && pct !== null && pct < p.prev_pct;
  const badge = recovered && alertOn ? `<span class="recovered">已恢复</span>` : "";
  return `<div class="pool">
    <div class="pool-row">
      <span class="p-name">${esc(p.name)}</span>
      <div class="p-bar"><div class="p-fill ${cls}" style="width:${width}%"></div></div>
      <span class="p-pct">${pct === null ? "—" : trimNum(pct) + "%"}</span>
      <span class="p-eta" title="预计耗尽剩余时间">${etaText(p)}</span>
      <button class="bell ${alertOn ? "on" : ""}" data-key="${esc(key)}"
        title="额度恢复时提醒我">${BELL_SVG}</button>
      ${badge}
    </div>
    ${poolTokenRow(p)}
  </div>`;
}

// 订阅汇总行：跨度内累计 tokens 总量 + input/cached/output 拆分 + TPS（取各池最大值）
function subTotalRow(sub) {
  const t = sub.usage_totals;
  const tps = sub.tps === null || sub.tps === undefined
    ? `<span class="brk">TPS：不可用</span>`
    : `<span class="brk">TPS <b>${fmtTps(sub.tps)}</b></span>`;
  if (!t) return `<div class="sub-total"><span>累计消耗：暂无 usage 数据</span>${tps}</div>`;
  return `<div class="sub-total">
    <span>累计消耗</span>
    <span class="total-v">${tok(t.total)}<span class="u"> tok</span></span>
    ${tps}
    <span class="brk">输入 <b>${tok(t.input)}</b></span>
    <span class="brk">缓存 <b>${tok(t.cached)}</b></span>
    <span class="brk">输出 <b>${tok(t.output)}</b></span>
    <span class="brk">请求 <b>${num(t.requests)}</b></span>
  </div>`;
}

// 进行中的标定任务：sub 名 → {state, done_tasks, total_tasks, error}
const calibJobs = {};

function calBtnHtml(sub) {
  const j = calibJobs[sub.name];
  if (j && j.state === "running") {
    const prog = j.total_tasks ? ` ${j.done_tasks || 0}/${j.total_tasks} 任务` : "";
    return `<button class="cal-btn" data-sub="${esc(sub.name)}" disabled>`
      + `<span class="spin"></span>标定中${prog}</button>`;
  }
  return `<button class="cal-btn" data-sub="${esc(sub.name)}" `
    + `title="跑一组标定任务，主动计算该订阅的额度当量（会真实消耗 token）">任务标定</button>`;
}

async function pollCalibrate(sub) {
  try {
    const res = await fetch(
      `/api/calibrate?subscription=${encodeURIComponent(sub)}`,
      {cache: "no-store"});
    if (!res.ok) return;
    const body = await res.json();
    calibJobs[sub] = body;
    if (body.state === "running") {
      refresh();
      setTimeout(() => pollCalibrate(sub), 1500);
    } else if (body.state === "done") {
      toast(`「${sub}」任务标定完成`);
      refresh();
    } else if (body.state === "error") {
      toast(`「${sub}」任务标定失败：${body.error || "未知错误"}`);
      refresh();
    }
  } catch (e) {
    toast("标定状态查询失败：" + e);
  }
}

function subCard(sub, alerts) {
  const title = sub.label || sub.name;
  const acct = sub.account ? ` <span class="acct">(${esc(sub.account)})</span>` : "";
  const updated = sub.stale ? `${esc(sub.last_sample_rel)} · 已过期`
    : esc(sub.last_sample_rel);
  const pools = (sub.pools || []).length
    ? `<div class="pool-rows">${sub.pools.map(p => poolRow(sub, p, alerts)).join("")}</div>`
    : `<div class="no-pools">该订阅暂无额度池样本。</div>`;
  const analysis = sub.analysis ? `<div class="analysis">${esc(sub.analysis)}</div>` : "";
  return `<div class="sub-card glass ${sub.stale ? "stale" : ""}">
    <div class="sub-head">
      <div class="brand" style="background:${brandColor(title)}">${esc(String(title)[0] || "?")}</div>
      <div class="sub-title-block">
        <div class="sub-title">${esc(title)}${acct}</div>
        <div class="sub-src">${esc(sub.agent)} · ${esc(sub.host)}</div>
      </div>
      ${calBtnHtml(sub)}
      <div class="sub-updated">${updated}</div>
    </div>
    ${pools}
    ${subTotalRow(sub)}
    ${analysis}
  </div>`;
}

/* ---------- 单订阅详细视图（CodexBar popover 布局） ---------- */

// 池块右上「约 Xd 后重置（推断）」：该池观测到 ≥2 次重置时按平均周期外推，不足则不显示
function resetBadge(sub, poolName, now) {
  const evs = (sub.reset_events || [])
    .filter(e => e.pool === poolName && typeof e.ts === "number")
    .map(e => e.ts).sort((a, b) => a - b);
  if (evs.length < 2) return "";
  let sum = 0;
  for (let i = 1; i < evs.length; i++) sum += evs[i] - evs[i - 1];
  const avg = sum / (evs.length - 1);
  const left = evs[evs.length - 1] + avg - now;
  const text = left <= 0 ? "已过推断重置时间" : `约 ${durText(left)} 后重置`;
  return `<span class="d-reset" title="据账本 ${evs.length} 次观测重置推断`
    + `（平均周期约 ${durText(avg)}），非官方口径">${text}（推断）</span>`;
}

// 分段式进度条：10 段圆角小段按剩余%填充；颜色沿用已用%阈值（<70 绿 / <90 黄 / ≥90 红）
function segBar(p) {
  const used = p.current_pct, rem = p.remaining_pct;
  const cls = used === null || used === undefined ? "none"
    : used >= 90 ? "high" : used >= 70 ? "mid" : "";
  const filled = rem === null || rem === undefined ? 0
    : Math.round(Math.max(0, Math.min(100, rem)) / 10);
  let segs = "";
  for (let i = 0; i < 10; i++)
    segs += `<span class="seg${i < filled ? " on " + cls : ""}"></span>`;
  return `<div class="seg-bar">${segs}</div>`;
}

// 池块 token 明细行：已用≈ · Q（区间或标定值徽标）· 预计耗尽
function poolQuotaLine(p) {
  if (!p.has_samples) return "";
  const parts = [];
  const used = tok(p.used_tokens);
  if (used !== null) parts.push(`已用 ≈ <b>${used}</b> tok`);
  if (p.available) {
    const q = tok(p.quota_tokens);
    const lo = tok(p.q_low), hi = tok(p.q_high);
    const rng = (lo !== null && hi !== null) ? ` <span class="rng">(${lo}–${hi})</span>` : "";
    parts.push(`Q ≈ <b>${q === null ? "—" : q}</b>${rng}`);
  }
  if (p.calibrated_q !== null && p.calibrated_q !== undefined) {
    const when = p.calibrated_at
      ? new Date(p.calibrated_at * 1000).toLocaleString("zh-CN", {hour12: false})
      : "未知";
    parts.push(`<span class="calib-badge" title="任务标定时间：${esc(when)}">`
      + `标定值 Q ≈ ${tok(p.calibrated_q)}</span>`);
  }
  const eta = etaText(p);
  if (eta !== "—" && eta !== "不可用") parts.push(`预计耗尽 <b>${eta}</b>`);
  return parts.length ? `<div class="d-pool-sub">${parts.join(" · ")}</div>` : "";
}

function poolBlock(sub, p, data) {
  const rem = p.remaining_pct;
  const used = p.current_pct;
  const cls = used === null || used === undefined ? "none"
    : used >= 90 ? "high" : used >= 70 ? "mid" : "ok";
  const bigPct = rem === null || rem === undefined
    ? `<div class="d-pct none">不可用<span class="u">剩余</span></div>`
    : `<div class="d-pct ${cls}">${trimNum(rem)}%<span class="u">剩余</span></div>`;
  const remText = rem === null || rem === undefined ? "不可用" : `${trimNum(rem)}%`;
  const rate = p.rate_tph === null || p.rate_tph === undefined ? "不可用"
    : `<b>${tok(p.rate_tph)}</b> tok/h`;
  const tps = p.tps === null || p.tps === undefined ? "不可用"
    : `<b>${fmtTps(p.tps)}</b>`;
  return `<div class="d-pool">
    <div class="d-pool-head">
      <span class="d-pool-name">${esc(p.name)}</span>
      ${resetBadge(sub, p.name, data.server_time)}
    </div>
    ${bigPct}
    ${segBar(p)}
    <div class="d-pool-sub">余量 ${remText} · 速率 ${rate} · TPS ${tps}</div>
    ${poolQuotaLine(p)}
  </div>`;
}

// 统计双列块：今日/近30天 各 token 用量 + price÷Q 折算费用（缺 price 或 Q 则不可用）
function statsBlock(sub) {
  const c = sub.cost || {};
  const fmtY = v => (v === null || v === undefined) ? null
    : "¥" + Number(v).toLocaleString("en-US",
        {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const cell = (v, k, na) =>
    `<div class="d-stat"><div class="v${na ? " na" : ""}">${v}</div>`
    + `<div class="k">${k}</div></div>`;
  const todayCost = fmtY(c.today_cost), monthCost = fmtY(c.month_cost);
  let out = `<div class="d-stats">
    ${cell(`${fmtTok(c.today_tokens || 0)}<span class="u"> tok</span>`, "今日 token 用量")}
    ${cell(todayCost === null ? "不可用" : todayCost, "今日费用折算", todayCost === null)}
    ${cell(`${fmtTok(c.month_tokens || 0)}<span class="u"> tok</span>`, "近 30 天 token 用量")}
    ${cell(monthCost === null ? "不可用" : monthCost, "近 30 天费用折算", monthCost === null)}
  </div>`;
  if (c.unit_price === null || c.unit_price === undefined) {
    const reason = c.price === null || c.price === undefined
      ? `未配置订阅价格（[subscriptions.${sub.name}].price）`
      : `「${c.pool || "?"}」池尚无可用 Q——先跑一次「任务标定」，或等监测估算收敛`;
    out += `<div class="d-hint">费用折算不可用：${esc(reason)}</div>`;
  } else {
    const src = c.q_source === "calibrated" ? "标定值" : "监测估算";
    out += `<div class="d-hint dim">折算口径：¥${num(c.price)} ÷ ${tok(c.q)} tok`
      + `（${esc(c.pool)} 池·${src}）≈ ¥${(c.unit_price * 1000).toFixed(4)}/1k tok</div>`;
  }
  return out;
}

// 30 天每日 tokens 柱状图：纯前端 SVG，最高柱顶标数值，无外部库
function chartBlock(sub) {
  const daily = sub.daily_usage || [];
  if (!daily.length) return "";
  const W = 660, H = 150, padL = 4, padR = 4, padT = 16, padB = 18;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const n = daily.length;
  const max = Math.max(0, ...daily.map(d => d.total || 0));
  const bw = innerW / n;
  const barW = Math.max(2, Math.min(14, bw * 0.6));
  const base = padT + innerH;
  let bars = "", maxLabel = "";
  daily.forEach((d, i) => {
    const v = d.total || 0;
    const h = max > 0 ? Math.max(1.5, v / max * innerH) : 1.5;
    const x = padL + i * bw + (bw - barW) / 2;
    const y = base - h;
    const isMax = max > 0 && v === max;
    bars += `<rect class="bar${isMax ? " max" : ""}" x="${x.toFixed(1)}" y="${y.toFixed(1)}"`
      + ` width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2">`
      + `<title>${d.date} · ${num(v)} tok</title></rect>`;
    if (isMax && !maxLabel)
      maxLabel = `<text class="max-label" x="${(x + barW / 2).toFixed(1)}"`
        + ` y="${(y - 4).toFixed(1)}" text-anchor="middle">${fmtTok(v)}</text>`;
  });
  const axis = `<line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}"`
    + ` stroke="rgba(255,255,255,.12)" stroke-width="1"/>`
    + `<text class="axis" x="${padL}" y="${H - 4}">${daily[0].date.slice(5)}</text>`
    + `<text class="axis" x="${W / 2}" y="${H - 4}" text-anchor="middle">`
    + `${daily[Math.floor(n / 2)].date.slice(5)}</text>`
    + `<text class="axis" x="${W - padR}" y="${H - 4}" text-anchor="end">`
    + `${daily[n - 1].date.slice(5)}</text>`;
  const empty = max === 0
    ? `<text class="axis" x="${W / 2}" y="${padT + innerH / 2}"`
      + ` text-anchor="middle">近 30 天暂无消耗记录</text>` : "";
  return `<div class="d-chart"><div class="d-chart-t">近 30 天每日 token 用量</div>`
    + `<svg viewBox="0 0 ${W} ${H}" role="img">${bars}${axis}${maxLabel}${empty}</svg></div>`;
}

function detailHtml(sub, data) {
  const title = sub.label || sub.name;
  const acct = sub.account ? ` <span class="acct">(${esc(sub.account)})</span>` : "";
  const updated = sub.last_sample_rel === "无样本" ? "无样本"
    : `${esc(sub.last_sample_rel)}已更新`;
  const pools = (sub.pools || []).length
    ? (sub.pools || []).map(p => poolBlock(sub, p, data)).join("")
    : `<div class="no-pools">该订阅暂无额度池样本。</div>`;
  const analysis = sub.analysis ? `<div class="analysis">${esc(sub.analysis)}</div>` : "";
  return `<div class="detail glass ${sub.stale ? "stale" : ""}">
    <div class="d-head">
      <div class="brand" style="background:${brandColor(title)}">${esc(String(title)[0] || "?")}</div>
      <div class="sub-title-block">
        <div class="d-title">${esc(title)}${acct}</div>
        <div class="d-sub">订阅 ${esc(sub.name)} · ${esc(sub.agent)} · ${esc(sub.host)}</div>
      </div>
      ${calBtnHtml(sub)}
      <div class="sub-updated">${updated}${sub.stale ? " · 已过期" : ""}</div>
    </div>
    ${pools}
    ${statsBlock(sub)}
    ${chartBlock(sub)}
    ${analysis}
    <div class="d-foot">最常用模型：<b>${esc(sub.top_model || "不可用")}</b></div>
  </div>`;
}

function renderTabs(subs) {
  const tabs = $("#tabs");
  if (!subs.length) {
    tabs.innerHTML = "";
    tabs.style.display = "none";
    return;
  }
  tabs.style.display = "";
  const btn = (id, label) =>
    `<button class="tab${activeTab === id ? " on" : ""}" data-tab="${esc(id)}">${esc(label)}</button>`;
  tabs.innerHTML = btn("overview", "概览")
    + subs.map(s => btn(s.name, s.label || s.name)).join("");
}

function render(data) {
  lastData = data;
  $("#ledger").textContent = "账本：" + data.ledger_path;
  const btn = $("#sample-btn");
  btn.disabled = !data.sampling_enabled;
  btn.title = data.sampling_enabled ? "" : "启动时需传 --agent/--probe 才可采样";
  $("#debug-link").hidden = !data.debug_enabled;

  const meta = $("#meta");
  meta.classList.toggle("stale", !!data.stale);
  const mode = data.clean_only ? "仅 clean 样本" : "全部样本";
  const last = data.last_sample_ts === null ? "—"
    : new Date(data.last_sample_ts * 1000).toLocaleString("zh-CN", {hour12: false});
  const nSubs = (data.subscriptions || []).length;
  const winTok = data.window_usage ? tok(data.window_usage.total) : null;
  const stats = `<div class="stats">
    <div class="stat"><div class="v">${winTok === null ? "—" : winTok}<span class="u">tok</span></div>
      <div class="k">近 ${data.window_hours}h 消耗</div></div>
    <div class="stat"><div class="v">${nSubs}</div>
      <div class="k">监测订阅</div></div>
    <div class="stat"><div class="v">${num(data.n_samples)}</div>
      <div class="k">样本数</div></div>
    <div class="stat"><div class="v">${fixed(data.span_hours, 1)}<span class="u">h</span></div>
      <div class="k">监测跨度</div></div>
  </div>`;
  let html = stats
    + `<div class="meta-line">速率窗口 ${data.window_hours} 小时；估计用${mode}`
    + `　·　最后采样：${last}`;
  if (data.sample_interval_sec) html += `（间隔 ${data.sample_interval_sec}s）`;
  html += `</div>`;
  if (data.stale)
    html += `<div class="warn-text">数据可能已过期：最新样本超过采样间隔 3 倍</div>`;
  if (data.external_tokens > 0)
    html += `<div class="warn-text">提示：clean=False 区间累计约 ${num(data.external_tokens)} tokens`
      + ` 可能混入未观测渠道（网页版、手机端等）；加 --clean-only 可将其排除出估计。</div>`;
  meta.innerHTML = html;

  const subs = $("#subs");
  const alerts = data.alerts || {};
  const subList = data.subscriptions || [];
  // 选中 Tab 的订阅消失时退回概览
  if (activeTab !== "overview" && !subList.some(s => s.name === activeTab))
    activeTab = "overview";
  renderTabs(subList);
  if (data.n_samples === 0 && !subList.length) {
    subs.innerHTML = `<div class="empty">账本还没有样本——这是正常的初始状态。<br>
      先跑一次采样：<code>python3 -m aisubench watch --agent &lt;name&gt; --probe mock --once</code></div>`;
    return;
  }
  if (!subList.length) {
    subs.innerHTML = `<div class="empty">样本里没有任何订阅分组，且配置 [subscriptions.*] 未声明订阅。</div>`;
    return;
  }
  if (activeTab === "overview") {
    subs.innerHTML = subList.map(s => subCard(s, alerts)).join("");
  } else {
    const sub = subList.find(s => s.name === activeTab);
    subs.innerHTML = detailHtml(sub, data);
  }
  maybeNotify(data, alerts);
}

function maybeNotify(data, alerts) {
  for (const sub of data.subscriptions || []) {
    for (const p of sub.pools || []) {
      const key = `${sub.name}.${p.name}`;
      const recovered = p.prev_pct !== null && p.prev_pct !== undefined
        && p.current_pct !== null && p.current_pct < p.prev_pct;
      if (!recovered || !alerts[key]) continue;
      const eventKey = `${key}@${sub.last_sample_ts}`;
      if (notified.has(eventKey)) continue;
      notified.add(eventKey);
      notifyRecovered(sub, p);
    }
  }
}

function notifyRecovered(sub, p) {
  const text = `${sub.label || sub.name} · ${p.name} 额度已恢复（当前已用 ${trimNum(p.current_pct)}%）`;
  try {
    if (!("Notification" in window)) return;  // 静默降级为徽标
    if (Notification.permission === "granted") {
      new Notification("AISUBench 额度恢复", {body: text});
    } else if (Notification.permission !== "denied") {
      Notification.requestPermission().then(perm => {
        if (perm === "granted")
          new Notification("AISUBench 额度恢复", {body: text});
      });
    }
  } catch (e) { /* 授权失败/不支持时静默降级为徽标 */ }
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 4000);
}

async function refresh() {
  try {
    const res = await fetch("/api/status", {cache: "no-store"});
    render(await res.json());
  } catch (e) {
    $("#meta").textContent = "状态获取失败：" + e;
  }
}

$("#tabs").addEventListener("click", ev => {
  const tab = ev.target.closest(".tab");
  if (!tab) return;
  activeTab = tab.dataset.tab;
  if (lastData) render(lastData);
});

$("#sample-btn").addEventListener("click", async () => {
  $("#sample-btn").disabled = true;
  try {
    const res = await fetch("/api/sample", {method: "POST"});
    const body = await res.json();
    toast(res.ok ? "采样完成" : `采样失败：${body.error || res.status}`);
  } catch (e) {
    toast("采样请求失败：" + e);
  } finally {
    refresh();
  }
});

$("#subs").addEventListener("click", async ev => {
  const calBtn = ev.target.closest(".cal-btn");
  if (calBtn) {
    const sub = calBtn.dataset.sub;
    if (!confirm(`任务标定会真实调用「${sub}」绑定的 agent 跑一组标定任务，`
                 + "消耗该订阅的 token 额度。确认开始？")) return;
    try {
      const res = await fetch("/api/calibrate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({subscription: sub}),
      });
      const body = await res.json();
      if (!res.ok) {
        toast(`标定启动失败：${body.error || res.status}`);
        return;
      }
      calibJobs[sub] = body.status || {state: "running"};
      refresh();
      setTimeout(() => pollCalibrate(sub), 800);
    } catch (e) {
      toast("标定请求失败：" + e);
    }
    return;
  }
  const bell = ev.target.closest(".bell");
  if (!bell) return;
  const key = bell.dataset.key;
  const enabled = !bell.classList.contains("on");
  bell.disabled = true;
  try {
    const res = await fetch("/api/alerts", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key, enabled}),
    });
    const body = await res.json();
    if (!res.ok || !body.ok) {
      toast(`提醒开关失败：${body.error || res.status}`);
      return;
    }
    bell.classList.toggle("on", enabled);
    if (enabled && "Notification" in window
        && Notification.permission === "default")
      Notification.requestPermission().catch(() => {});
    toast(enabled ? `已开启恢复提醒：${key}` : `已关闭恢复提醒：${key}`);
  } catch (e) {
    toast("提醒开关请求失败：" + e);
  } finally {
    bell.disabled = false;
  }
});

refresh();
setInterval(refresh, 5000);
</script>
