# AISUBench 配置示例。
# 注意：下面 [subscriptions] 的价格与额度均为示例/合成数据，非真实价格。
# 评测真实订阅时请覆盖为实际值，私有差异写入被 git 忽略的 aisubench.local.toml。

[project]
name = "AISUBench"

[agents.mock]
command = ["python3", "-m", "aisubench", "mock-agent"]
# 该 agent 采样样本归属的订阅名（写入账本样本的 subscription 字段；
# 缺省时样本归 agent 名本身；旧样本无该字段则归 default 分组）。
subscription = "demo"

[agents.api]
command = ["python3", "-m", "aisubench", "api-agent"]

# 示例订阅声明（合成数据，非真实信息）。监控面板/CLI status 按订阅分组展示：
#   label           卡片显示名（缺省显示订阅名本身）
#   account         掩码账号（可写已掩码形式如 t***@g***.com；写明文邮箱则自动掩码）
#   agent / host    来源行显示的 agent 名与主机（host 缺省 localhost）
#   probe           额度探针（mock / arkcli / manual，与 watch --probe 对应）
#   pools           额度池声明（账本样本 pools 字段的键，见 ledger.py）
#   granularity_pct 读数粒度 g：该订阅额度页最小可分辨的已用百分比刻度
# price / window    评测折算用：价格（元）与标定对应的额度窗口
[subscriptions.demo]
label = "Max 20x"
account = "t***@g***.com"
agent = "mock"
host = "localhost"
probe = "mock"
pools = ["5h", "week"]
granularity_pct = 1.0
price = 30.0
window = "5h"

# watch 持续监测的采样参数（账本契约与 clean 口径见 aisubench/watch.py、aisubench/ledger.py）。
[watch]
# 距上一个样本的间隔小于该秒数时，样本记 clean=true（无法排除外部渠道消耗则不可信）。
clean_window_sec = 600
# 未传 --interval 时的循环采样间隔（秒）。
interval_sec = 300
# 账本与 meter 字节偏移的持久化路径（相对仓库根；state/ 已被 git 忽略）。
ledger = "state/ledger.jsonl"
offsets_file = "state/meter_offsets.json"

# watch 的 meter 配置示例：meter = "kimi"（解析 wire.jsonl）或 "claude"（解析会话 jsonl）。
# 路径请换成本机真实日志文件后再取消注释——以下是占位示例，默认配置不指向不存在的路径。
# [agents.kimi]
# meter = "kimi"
# log_path = "/home/YOU/.kimi-code/sessions/YOUR-SESSION/wire.jsonl"
# [agents.claude]
# meter = "claude"
# log_path = "/home/YOU/.claude/projects/YOUR-PROJECT/YOUR-SESSION.jsonl"
# 说明：`watch --agent mock` 为冒烟特判，自动使用合成演示日志 state/mock_wire.jsonl
# （首次采样生成），无需真实 agent 日志。

[calibration]
# 标定百分比显示粒度：额度页最小可分辨的已用百分比刻度。
granularity_pct = 1.0
# 单次标定最多运行的任务数（预算上限，到数即停）。
max_tasks = 20
