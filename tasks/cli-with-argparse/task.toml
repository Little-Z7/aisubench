id = "cli-with-argparse"
tier = "medium"
prompt = """实现一个 argparse 命令行工具。
输入：工作区的 cli.py（空骨架，需要你实现）；工作区另有数据文件 numbers.txt（每行一个整数，可能含空行，整数有负有正）。
要做：把 cli.py 实现成如下命令行工具，只用标准库 argparse，不引入第三方包：
  用法 `python3 cli.py FILE --op {sum,max,count}`
- FILE 是必填位置参数，给出整数文件的路径（按当前工作目录解析）；
- --op 是必填参数，取值只能是 sum、max、count，分别表示所有整数之和、最大值、整数个数；
- 成功时 stdout 只输出这一个十进制整数并以换行结尾，退出码 0；
- FILE 不存在，或文件里一个整数都没有：stdout 不输出内容，stderr 输出一行以 error: 开头的消息，退出码 1；
- 缺少 FILE 或缺少 --op、--op 取值非法这类参数错误：交给 argparse 处理，usage 出现在 stderr，退出码 2。
输出：实现好的工作区 cli.py（不要改动 numbers.txt）。
验收：verify 用子进程真实运行 cli.py 的多组参数组合（包括换一份数据文件调用，防止把结果写死在代码里），逐一断言退出码、stdout 与 stderr。"""
verify = "python3 verify.py"
timeout_sec = 30
max_tokens = 4000
tags = ["python", "cli"]
